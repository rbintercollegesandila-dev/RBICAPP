name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create www folder & Ensure index.html exists
      run: |
        mkdir -p www
        find . -name "index.html" -not -path "./www/*" -not -path "./android/*" -exec cp {} www/ \; 2>/dev/null || true
        if [ ! -f www/index.html ]; then
          echo "<!DOCTYPE html><html><head><title>RBIC App</title></head><body><h1>RBIC App</h1></body></html>" > www/index.html
        fi

    - name: Install Dependencies & Capacitor
      run: |
        npm install
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

    - name: Add Android Platform Automatically
      run: |
        if [ ! -d "android" ]; then
          npx cap init RBICAPP com.rbic.app --web-dir www --yes
          npx cap add android
        fi
        npx cap sync

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBIC-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
