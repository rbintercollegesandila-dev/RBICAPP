
name: Build RBIC Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java Setup
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Node Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Check Project Files
      - name: Check Project
        run: |
          echo "Checking RBICAPP files..."
          ls -la
          node --version
          java -version

      # 5. Install Node Dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 6. Install Capacitor
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      # 7. Ensure Web Folder
      - name: Prepare Web Assets
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            echo "Checking website files..."

            if [ -f index.html ]; then
              cp index.html www/index.html
            else
              echo "ERROR: Original index.html not found!"
              exit 1
            fi
          fi

      # 8. Check Capacitor Config
      - name: Check Capacitor Configuration
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor config file missing!"
            exit 1
          fi

      # 9. Android Platform
      - name: Setup Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      # 10. Clean Gradle Cache
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf android/.gradle

      # 11. Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --refresh-dependencies \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.internal.instrumentation.agent=false

      # 12. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBICAPP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
