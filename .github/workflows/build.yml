
name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create www folder
      run: |
        mkdir -p www
        find . -name "index.html" -not -path "./www/*" -not -path "./android/*" -exec cp {} www/ \; 2>/dev/null || true
        if [ ! -f www/index.html ]; then
          echo "<!DOCTYPE html><html><head><title>RBIC App</title></head><body><h1>RBIC App</h1></body></html>" > www/index.html
        fi

    - name: Install Dependencies & Capacitor
      run: |
        npm install
        npm install --save-dev @capacitor/cli @capacitor/core

    - name: Add Android Platform Automatically
      run: |
        if [ ! -d "android" ]; then
          npm install --save @capacitor/android
          npx cap add android
        fi
        npx cap sync android

    - name: Clean Gradle Cache
      run: |
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/daemon
        rm -rf android/.gradle

    - name: Build Android APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBIC-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
