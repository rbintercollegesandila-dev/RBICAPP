name: Build RBICAPP Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "Android SDK not found!"
            exit 1
          fi

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Check Environment
      - name: Check Environment
        run: |
          node --version
          npm --version
          java -version
          echo "RBICAPP Build Started"

      # 6. Install Dependencies
      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund

      # 7. Prepare Website Files
      - name: Prepare Web Assets
        run: |
          mkdir -p www

          rsync -av ./ www/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/functions/' \
            --exclude='/android/' \
            --exclude='/www/' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/capacitor.config.json' \
            --exclude='/google-services.json' \
            --exclude='/build.gradle' \
            --exclude='/capacitor.build.gradle' \
            --exclude='/capacitor.settings.gradle' \
            --exclude='/AndroidManifest.xml' \
            --exclude='/config.xml' \
            --exclude='/cordova.js' \
            --exclude='/cordova_plugins.js'

          test -f www/index.html

          echo "Website files prepared successfully"

      # 8. Check Capacitor Configuration
      - name: Check Capacitor Config
        run: |
          test -f capacitor.config.json
          node -e "
            const c = require('./capacitor.config.json');
            if (c.appId !== 'in.rbic.school') {
              throw new Error('Incorrect App ID');
            }
            if (c.webDir !== 'www') {
              throw new Error('Incorrect webDir');
            }
            console.log('Capacitor configuration OK');
          "

      # 9. Create Android Platform
      - name: Setup Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          test -f android/gradlew

      # 10. Setup Firebase Android Config
      - name: Setup Firebase
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Firebase configuration copied"
          else
            echo "Firebase config not found"
          fi

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 12. Clean Gradle Cache
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf android/.gradle

      # 13. Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --refresh-dependencies \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.internal.instrumentation.agent=false

      # 14. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          ls -lh "$APK"
          echo "RBICAPP APK BUILD SUCCESS"

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RBICAPP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
